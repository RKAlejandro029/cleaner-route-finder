name: Sync Lessen tasks

on:
  schedule:
    # Every 4 hours. Adjust the cron expression if you want it more/less
    # frequent — GitHub Actions cron is UTC.
    - cron: "0 */4 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Lessen sync
        env:
          LESSEN_EMAIL: ${{ secrets.LESSEN_EMAIL }}
          LESSEN_PASSWORD: ${{ secrets.LESSEN_PASSWORD }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: node scripts/lessen-sync.js
